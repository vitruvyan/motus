# vitruvyan-axis — the AXIS kernel, installable.
#
# The distribution is vitruvyan-axis; the import stays `axis`. The core
# carries ZERO runtime dependencies — stdlib only, verified at import time
# (the persistence adapters that need psycopg2/httpx sit behind a lazy
# PEP-562 __getattr__, and the audit couriers import boto3/google inside
# the methods that use them, with graceful fallback). Anything heavier is
# an extra you ask for by name.
#
# Consumers stop vendoring byte-copies of this package the day this file
# ships in a tagged release: `pip install vitruvyan-axis==0.4.0`.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vitruvyan-axis"
dynamic = ["version"]
description = "AXIS — a small graph orchestrator whose immutable trace is the audit evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vitruvyan" }]
keywords = ["orchestrator", "graph", "audit", "immutable", "trace"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
qdrant = ["httpx>=0.27"]
audit = ["boto3>=1.34", "google-api-python-client>=2.100"]
all = ["vitruvyan-axis[postgres,qdrant,audit]"]

[tool.setuptools.packages.find]
include = ["axis*"]

[tool.setuptools.dynamic]
version = { attr = "axis.__version__" }
