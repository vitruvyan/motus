# vitruvyan-motus — the Motus kernel, installable.
#
# The distribution is vitruvyan-motus; the import is `vitruvyan_motus`. This
# is a rename-in-place of the predecessor `vitruvyan-axis` distribution
# (ADR-001 §Decision 1), not a fork: the accepted contract in `contract/` is
# unchanged, only the code that must satisfy it is new.
#
# `axis/` is gone from the working tree (ADR-009). The compatibility switch
# it was waiting for (ADR-001 §Decision 2, executed by ADR-003) happened:
# both frozen corpora resolve through `tests/contract/kernel.py` to
# `vitruvyan_motus.compat`, not to the predecessor. The tag `v0.6.1` is the
# byte-preserved artifact, and the `vitruvyan-axis` 0.4.0 distribution stays
# independently pinnable for consumers who have not migrated. `where =
# ["src"]` below is still what defines the wheel: one package, no history.
#
# Apache-2.0 is the founder-approved license for Motus. PyPI publication
# remains a separate explicit release action.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitruvyan-motus"
dynamic = ["version"]
description = "Motus — an embeddable, trace-first graph execution runtime whose verifiable trace is the audit evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vitruvyan" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["orchestrator", "graph", "audit", "verifiable", "trace"]
# The kernel imports nothing outside the standard library, and that stays
# true. The distribution installs one thing: `jsonschema`, which the shipped
# validator needs. Those are two different claims and the README states both.
# A trace nobody can check is a log; the tool that checks it is the product.
dependencies = ["jsonschema>=4.21,<5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

# ADR-033 decision 6: the PyPI project page renders this distribution's
# METADATA and nothing else, and until this table existed it carried no way
# back to the repository, the contract that is this runtime's authority
# (ADR-001), or the licence under which any of it may be used. All three
# resolve once the repository goes public at first publication (ADR-032
# decision 8) — `contract/` and `LICENSE` are paths that exist in this tree
# today, not ones invented for the page.
[project.urls]
Repository = "https://github.com/vitruvyan/motus"
Contract = "https://github.com/vitruvyan/motus/tree/main/contract"
License = "https://github.com/vitruvyan/motus/blob/main/LICENSE"

[project.optional-dependencies]
# The declared, pinned test environment (ADR-001 first-commit conditions):
# "the suite passes" is meaningless until the environment is part of the
# contract — a bare venv shows async-plugin failures that are noise.
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<0.25", "jsonschema>=4.21,<5"]

# The integration MCP (ADR-022). It brings a SECOND third-party dependency to
# this file that the kernel does not need — `jsonschema`, for the shipped
# validator, is the first — and it is optional for that reason:
# a library that grows a server by default has become a service, and nobody
# decided that. `vitruvyan_motus.mcp.tools` is stdlib-only and importable
# without this extra — only the transport binding needs the SDK.
mcp = ["mcp>=2,<3"]

# Two roots, listed rather than discovered. `src/vitruvyan_motus` is the
# kernel; `contract/` is mapped in as `vitruvyan_motus.contract` so that
# installing Motus installs the means to check what it produced. The contract
# directory keeps its place in the tree — it is the authority (ADR-001), not a
# copy — and only the validator and the declared contract schemas travel: the prose and the
# frozen fixtures stay on GitHub, where the reader who needs them already is.
# ADR-022 decision 1 extends this list. The MCP's reader is an agent inside a
# virtualenv, so "the reader who needs the prose is already on GitHub" — true
# of a human — fails for it: every source its tools cite must travel with the
# code, version-matched, or the server would have to fetch one, and an answer
# derived from `main` while the caller runs 0.9.0 is wrong in the most
# convincing way available. What travels is exactly what `mcp/sources.py`
# names in CITABLE, not a directory, and a test compares the two.
[tool.setuptools]
packages = [
    "vitruvyan_motus",
    "vitruvyan_motus.contract",
    "vitruvyan_motus.mcp",
    "vitruvyan_motus.adr",
    "vitruvyan_motus.examples",
]
package-dir = { "vitruvyan_motus" = "src/vitruvyan_motus", "vitruvyan_motus.contract" = "contract", "vitruvyan_motus.mcp" = "src/vitruvyan_motus/mcp", "vitruvyan_motus.adr" = "adr", "vitruvyan_motus.examples" = "examples" }

[tool.setuptools.package-data]
vitruvyan_motus = ["py.typed"]
"vitruvyan_motus.contract" = ["*.schema.json", "node-protocol.md", "README.md", "guarantees.md"]
"vitruvyan_motus.adr" = ["ADR-022-the-integration-mcp.md"]
# No package-data entry for the examples: `vitruvyan_motus.examples` is a
# declared package, so `build_py` copies its `*.py` as modules and all six
# travel. A `package-data` line here named two of them and changed the wheel
# not at all — configuration that misdescribes what ships, and that no test
# could notice being deleted.

[project.scripts]
motus-validate = "vitruvyan_motus.contract.validate:main"
motus-evidence = "vitruvyan_motus.verification_query_cli:main"
motus-mcp = "vitruvyan_motus.mcp.server:main"

[tool.setuptools.dynamic]
version = { attr = "vitruvyan_motus.__version__" }

# The kernel suite runs over `tests/` and nothing else. `plugs/` holds separate
# DISTRIBUTIONS with their own dependencies and their own suites — collecting
# them here would make `pytest` at the repository root fail on a machine that
# has Motus and not `opentimestamps`, which is exactly the coupling the plugs
# exist to avoid. Each plug is run from its own directory, and CI runs both.
[tool.pytest.ini_options]
testpaths = ["tests"]
