# vitruvyan-motus — the Motus kernel, installable.
#
# The distribution is vitruvyan-motus; the import is `vitruvyan_motus`. This
# is a rename-in-place of the predecessor `vitruvyan-axis` distribution
# (ADR-001 §Decision 1), not a fork: the accepted contract in `contract/` is
# unchanged, only the code that must satisfy it is new.
#
# `axis/` is gone from the working tree (ADR-009). The compatibility switch
# it was waiting for (ADR-001 §Decision 2, executed by ADR-003) happened:
# both frozen corpora resolve through `tests/contract/kernel.py` to
# `vitruvyan_motus.compat`, not to the predecessor. The tag `v0.6.1` is the
# byte-preserved artifact, and the `vitruvyan-axis` 0.4.0 distribution stays
# independently pinnable for consumers who have not migrated. `where =
# ["src"]` below is still what defines the wheel: one package, no history.
#
# Apache-2.0 is the founder-approved license for Motus. PyPI publication
# remains a separate explicit release action.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vitruvyan-motus"
dynamic = ["version"]
description = "Motus — an embeddable, trace-first graph execution runtime whose immutable trace is the audit evidence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vitruvyan" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["orchestrator", "graph", "audit", "immutable", "trace"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
# The declared, pinned test environment (ADR-001 first-commit conditions):
# "the suite passes" is meaningless until the environment is part of the
# contract — a bare venv shows async-plugin failures that are noise.
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<0.25", "jsonschema>=4.21,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vitruvyan_motus*"]

[tool.setuptools.package-data]
vitruvyan_motus = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "vitruvyan_motus.__version__" }
