name: Frozen contract paths

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read
  statuses: write

jobs:
  trusted-frozen-contract-audit:
    name: trusted-frozen-contract-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted head without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head"
      - name: Reject edits to frozen evidence
        id: frozen_guard
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_frozen_paths.py "$BASE_SHA" "$HEAD_SHA"
      - name: Publish the required status on the PR head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GUARD_OUTCOME: ${{ steps.frozen_guard.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$GUARD_OUTCOME" = "success" ]; then
            state=success
            description="Frozen contract evidence is unchanged"
          else
            state=failure
            description="Frozen contract evidence was changed"
          fi
          gh api "repos/$REPOSITORY/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="frozen-contract-paths" \
            -f description="$description" \
            -f target_url="$RUN_URL"
      - name: Fail the trusted audit when the guard rejected the diff
        if: steps.frozen_guard.outcome != 'success'
        run: exit 1
