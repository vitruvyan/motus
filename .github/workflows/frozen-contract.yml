name: Frozen contract paths

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

jobs:
  frozen-contract-paths:
    name: frozen-contract-paths
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Fetch the untrusted head without checking it out
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "pull/${PR_NUMBER}/head"
      - name: Reject edits to frozen evidence
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_frozen_paths.py "$BASE_SHA" "$HEAD_SHA"
