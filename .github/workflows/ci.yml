name: Contract and baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, motus/foundation-contract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-suite:
    name: contract-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10.12"
          cache: pip
      - name: Install the pinned test environment
        run: python -m pip install -e ".[test]" -c constraints/test.txt
      - name: Run the complete suite
        run: python -m pytest tests/ -q

  slo-baseline:
    name: slo-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10.12"
      - name: Reproduce guarantees section 3 from raw evidence
        run: >-
          python benchmarks/check_slo_baseline.py
          --candidate benchmarks/candidate-v0.7.0-epyc-py310.json
