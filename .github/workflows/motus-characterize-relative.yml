name: Motus relative characterization

# Two source trees, one harness, one machine, interleaved. The absolute gate
# this supports compared a candidate against a ceiling derived from a specific
# host and checked only that the CPU model said "EPYC" -- and an EPYC 7763
# measured 29% slower than the EPYC 9V74 the ceiling came from. A gate that
# answers differently on identical code is measuring the runner, not the code.
#
# Scheduled execution moved to Jenkins. This GitHub workflow is retained only
# as a manual fallback so it cannot consume hosted-runner minutes automatically.

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: The previous release to measure against
        required: true
        default: v0.6.1
      anchor_ref:
        description: An older release, for cumulative drift (optional)
        required: false
        default: ""
      pairs:
        description: Interleaved measurement rounds per subject (>= 5)
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  relative:
    name: relative-characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0   # the baseline and anchor refs must be reachable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.10.12"

      - name: Resolve the refs this run compares
        id: refs
        env:
          BASELINE_REF: ${{ github.event.inputs.baseline_ref }}
          ANCHOR_REF: ${{ github.event.inputs.anchor_ref }}
          PAIRS_IN: ${{ github.event.inputs.pairs }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          BASELINE="$BASELINE_REF"
          ANCHOR="$ANCHOR_REF"
          PAIRS="$PAIRS_IN"
          [ -z "$BASELINE" ] && BASELINE=v0.6.1
          [ -z "$PAIRS" ] && PAIRS=5
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "anchor=$ANCHOR"     >> "$GITHUB_OUTPUT"
          echo "pairs=$PAIRS"       >> "$GITHUB_OUTPUT"

      - name: Check out the subjects beside the candidate
        env:
          BASELINE_REF: ${{ steps.refs.outputs.baseline }}
          ANCHOR_REF: ${{ steps.refs.outputs.anchor }}
        run: |
          git worktree add --detach /tmp/baseline "$BASELINE_REF"
          if [ -n "$ANCHOR_REF" ]; then
            git worktree add --detach /tmp/anchor "$ANCHOR_REF"
          fi

      - name: Measure both trees with the candidate's harness
        env:
          BASELINE_REF: ${{ steps.refs.outputs.baseline }}
          ANCHOR_REF: ${{ steps.refs.outputs.anchor }}
          CANDIDATE_REF: ${{ github.ref_name }}
          PAIRS_OUT: ${{ steps.refs.outputs.pairs }}
        run: |
          # An array, not a string: $ANCHOR_ARGS unquoted would word-split an
          # attacker-supplied ref into extra arguments to the harness. That is
          # not command execution, so the env: move above does not close it —
          # the same value, one layer down, choosing flags instead of code.
          ANCHOR_ARGS=()
          if [ -n "$ANCHOR_REF" ]; then
            ANCHOR_ARGS=(--anchor-src /tmp/anchor/src --anchor-ref "$ANCHOR_REF")
          fi
          python benchmarks/collect_relative_baseline.py \
            --baseline-src /tmp/baseline/src \
            --baseline-ref "$BASELINE_REF" \
            --candidate-src src \
            --candidate-ref "$CANDIDATE_REF" \
            --pairs "$PAIRS_OUT" \
            "${ANCHOR_ARGS[@]}" \
            > benchmarks/relative-latest.json

      - name: Report the ratios this job measured
        run: python benchmarks/check_relative_baseline.py benchmarks/relative-latest.json

      - name: Upload the raw relative evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: motus-relative-${{ github.run_id }}   # ref_name may contain '/'
          path: benchmarks/relative-latest.json
          if-no-files-found: error
          retention-days: 90
